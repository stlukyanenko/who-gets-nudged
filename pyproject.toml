[project]
name = "who-gets-nudged"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "inspect-ai>=0.3.281",
    "matplotlib>=3.11.2",
    "openai>=3.35.1",
]

# Registers the claudecli/ model provider with Inspect (src/nudged/claude_cli.py).
[project.entry-points.inspect_ai]
nudged = "nudged.claude_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nudged"]
